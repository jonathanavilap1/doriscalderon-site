name: LM Club CI
on:
  push:
    paths: ['contracts/**', 'backend-aws/**', 'tv-dashboard/**', 'ios-app/**', '.github/workflows/lmclub-ci.yml']
  pull_request:
    paths: ['contracts/**', 'backend-aws/**', 'tv-dashboard/**', 'ios-app/**']

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
        working-directory: contracts
      - run: npm run check:generated && npm run typecheck && npm test
        working-directory: contracts

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
        working-directory: contracts
      - run: npm ci
        working-directory: backend-aws
      - run: npm run build && npm test && npx cdk synth --quiet
        working-directory: backend-aws

  tv-dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
        working-directory: contracts
      - run: npm ci
        working-directory: tv-dashboard
      - run: npm test && VITE_API_BASE_URL=https://example.invalid npm run build
        working-directory: tv-dashboard

  ios-app:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: swift test
        working-directory: ios-app
      - name: Compile every layer for device SDKs (WorkoutManager is watchOS-only)
        working-directory: ios-app
        run: |
          xcodebuild -scheme LMClubWorkout -destination 'generic/platform=watchOS' build
          xcodebuild -scheme LMClubPresentation -destination 'generic/platform=iOS' build
